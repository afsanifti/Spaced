name: Build & Release Android APK

on:
  push:
    branches:
      - beta
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # --- BETA BRANCH BUILD & PRE-RELEASE ---
      - name: Build Beta Debug APK
        if: github.ref == 'refs/heads/beta'
        run: ./gradlew assembleDebug

      - name: Publish Beta Pre-Release
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-build-${{ github.run_number }}
          name: "Beta Build #${{ github.run_number }}"
          body: "Automated pre-release generated from `beta` branch."
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- MAIN BRANCH BUILD & STABLE RELEASE ---
      - name: Build Stable Release APK
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease

      - name: Publish Stable Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Stable Release v1.0.${{ github.run_number }}"
          body: "Official release generated from `main` branch."
          prerelease: false
          files: app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}